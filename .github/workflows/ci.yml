name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --experimental-strip-types --test test-openhands-bridge.mjs
      - run: node --experimental-strip-types --test test-docker-list-scope.mjs
      - run: node --test integrations/deepharness/*.test.mjs
      - name: Verify disabled DeepHarness Agent Mesh local receiver and synthetic Unix relay
        run: node --test test-deepharness-agent-mesh-runtime.mjs
      - run: node test-exec-broker-session-capacity.mjs
      - run: node test-paperclip-semantic.mjs
      - run: node test-docker-candidate-contract.mjs
      - run: node test-docker-proxy-candidate-startup.mjs
      - run: node test-docker-compose-candidate-env-wiring.mjs
      - run: bash test-e2e.sh
      - run: bash test-agent-pairing.sh
      - run: bash test-agent-installer.sh
      - run: bash test-agent-postgres-readback-runtime.sh
      - run: bash -n install-agent-managed-admin-broker.sh
      - run: bash -n uninstall-agent-managed-admin-broker.sh
      - run: node test-multi-vps-capability-baseline.mjs
      - run: node test-operator-minimal-disclosure.mjs
      - run: node test-target-agent-approvals.mjs
      - run: node test-deepharness-docker-read-approval.mjs
      - run: node test-managed-admin-noauth.mjs
      - run: node test-managed-admin-ticket.mjs
      - run: node test-managed-admin-approvals.mjs
      - run: node test-managed-admin-broker.mjs
      - run: node test-managed-admin-agent-proxy.mjs
      - run: node test-managed-admin-control-plane-e2e.mjs
      - run: node test-postgres-readback.mjs
      - run: node test-postgres-readback-proxy.mjs
      - name: Build production image
        run: docker build -t remote-ops-mcp:ci .
