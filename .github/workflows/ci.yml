name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node test-paperclip-semantic.mjs
      - run: node test-docker-candidate-contract.mjs
      - run: bash test-e2e.sh
      - run: bash test-agent-pairing.sh
      - name: Build production image
        run: docker build -t remote-ops-mcp:ci .
